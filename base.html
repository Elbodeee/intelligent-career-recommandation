<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CareerPath AI — ADUSTECH{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
  :root { --primary:#1a3c6e; --accent:#2563eb; --light:#f0f4ff; }
  body { font-family:'Segoe UI',sans-serif; background:#f5f7fa; }
  .navbar { background: var(--primary) !important; }
  .navbar-brand { font-weight:700; font-size:1.3rem; }
  .sidebar { min-height:100vh; background:var(--primary); padding-top:20px; width:240px; }
  .sidebar a { color:rgba(255,255,255,.75); display:block; padding:10px 20px; text-decoration:none; border-radius:6px; margin:2px 8px; font-size:.9rem; }
  .sidebar a:hover, .sidebar a.active { background:rgba(255,255,255,.15); color:#fff; }
  .sidebar a i { margin-right:8px; }
  .sidebar .sidebar-heading { color:rgba(255,255,255,.4); font-size:.7rem; text-transform:uppercase; letter-spacing:1px; padding:12px 20px 4px; }
  .card { border:none; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,.07); }
  .card-header { background:var(--primary); color:#fff; border-radius:12px 12px 0 0 !important; font-weight:600; }
  .stat-card { border-radius:12px; padding:20px; color:#fff; }
  .stat-card .stat-num { font-size:2rem; font-weight:700; }
  .stat-card .stat-label { font-size:.8rem; opacity:.85; text-transform:uppercase; letter-spacing:.5px; }
  .btn-primary { background:var(--accent); border-color:var(--accent); }
  .btn-primary:hover { background:#1d4ed8; border-color:#1d4ed8; }
  .table thead th { background:var(--light); color:var(--primary); font-weight:600; font-size:.85rem; }
  .rec-card { border-left:4px solid var(--accent); border-radius:10px; background:#fff; padding:20px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
  .rec-card .career-name { font-size:1.1rem; font-weight:700; color:var(--primary); }
  .rec-card .match-badge { background:#dbeafe; color:var(--accent); font-size:.75rem; font-weight:600; padding:3px 10px; border-radius:20px; }
  .rec-card .reason { font-size:.88rem; color:#555; margin-top:8px; }
</style>
</head>
<body>
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div style="position:fixed;top:10px;right:10px;z-index:9999;min-width:280px">
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} alert-dismissible fade show shadow" role="alert">
          {{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
{% block body %}{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
