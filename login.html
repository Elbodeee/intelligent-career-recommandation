{% extends 'base.html' %}
{% block title %}Login — CareerPath AI{% endblock %}
{% block body %}
<div style="min-height:100vh;background:linear-gradient(135deg,#1a3c6e,#2563eb);display:flex;align-items:center;justify-content:center;padding:20px;">
  <div class="card p-4" style="width:100%;max-width:420px;">
    <div class="text-center mb-4">
      <div style="font-size:2.5rem">🎓</div>
      <h4 class="fw-bold mt-2" style="color:#1a3c6e">CareerPath AI</h4>
      <p class="text-muted small">ADUSTECH Career Recommendation System</p>
    </div>
    <form method="POST">
      <div class="mb-3">
        <label class="form-label fw-semibold">Email Address</label>
        <div class="input-group"><span class="input-group-text"><i class="bi bi-envelope"></i></span>
        <input type="email" name="email" class="form-control" placeholder="your@email.com" required></div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Password</label>
        <div class="input-group"><span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required></div>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 fw-bold"><i class="bi bi-box-arrow-in-right me-2"></i>Sign In</button>
    </form>
    <p class="text-center text-muted small mt-3">Don't have an account? <a href="/register" class="fw-semibold">Register here</a></p>
  </div>
</div>
{% endblock %}
